  <path d="M20 342 L82 272 L118 306 L152 258 L196 318 L238 264 L282 320 L318 278 L380 342 L380 390 L20 390 Z" fill="#172018" opacity=".85"/>
  <path d="M20 342 L82 272 L118 306 L152 258 L196 318 L238 264 L282 320 L318 278 L380 342" fill="none" stroke="#c9a961" stroke-opacity=".22"/>
  <path d="M82 272 L82 390 M152 258 L152 390 M282 320 L282 390" stroke="#c9a961" stroke-opacity=".1"/>

  <!-- 山神法相 · 群峰为冠 -->
