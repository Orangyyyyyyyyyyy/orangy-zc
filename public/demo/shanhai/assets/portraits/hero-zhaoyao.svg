    <circle class="mossGlow" cx="322" cy="300" r="1.5" style="animation-delay:1.6s"/>
    <circle class="mossGlow" cx="128" cy="150" r="1.4" style="animation-delay:2.4s"/>
    <circle class="mossGlow" cx="270" cy="120" r="1.3" style="animation-delay:3.2s"/>
  </g>

  <rect width="400" height="520" fill="url(#vig)"/>
</svg>
