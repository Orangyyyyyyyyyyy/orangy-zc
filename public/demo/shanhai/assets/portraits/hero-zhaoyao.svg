    </g>
    <g fill="#c9a961" opacity=".75">
      <circle cx="106" cy="70" r="3"/><circle cx="144" cy="42" r="2.6"/><circle cx="204" cy="68" r="3"/><circle cx="320" cy="100" r="2.6"/><circle cx="284" cy="70" r="2.4"/>
    </g>

    <!-- 长发 · 藤萝 -->
    <path d="M152 208 C134 268 132 344 146 414 C154 448 170 452 178 430 C164 364 164 282 176 224 Z" fill="#2c3d27"/>
    <path d="M248 208 C266 268 268 344 254 414 C246 448 230 452 222 430 C236 364 236 282 224 224 Z" fill="#2c3d27"/>
    <path d="M166 214 C154 288 158 366 170 426" fill="none" stroke="#8fae76" stroke-width="2" opacity=".5"/>
    <path d="M234 214 C246 288 242 366 230 426" fill="none" stroke="#8fae76" stroke-width="2" opacity=".45"/>

    <!-- 身形 -->
    <path d="M112 520 Q106 428 136 356 Q154 314 200 308 Q246 314 264 356 Q294 428 288 520 Z" fill="url(#robe)"/>
    <path d="M200 308 Q246 314 264 356 Q294 428 288 520 L234 520 Q248 424 224 352 Z" fill="#000" opacity=".12"/>
    <path d="M168 306 L200 390 L232 306 L216 296 L200 340 L184 296 Z" fill="#1a2418"/>
    <path d="M124 470 Q200 500 276 470 M118 500 Q200 530 282 500" fill="none" stroke="#c9a961" stroke-opacity=".2"/>

