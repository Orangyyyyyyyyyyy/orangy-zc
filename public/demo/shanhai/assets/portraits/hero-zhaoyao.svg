    <path d="M104 214 L104 336 M168 182 L168 336 M236 200 L236 336 M306 224 L306 336" stroke="#c9a961" stroke-opacity=".12"/>
    <path d="M104 226 L116 244 L126 232 M168 198 L182 220 L194 206 M236 216 L248 236 L258 224 M306 238 L316 252" fill="none" stroke="#8fae76" stroke-opacity=".45" stroke-width="2"/>
    <circle cx="168" cy="186" r="2.2" fill="#e8d3a0" opacity=".8"/>
    <circle cx="306" cy="228" r="1.8" fill="#e8d3a0" opacity=".7"/>
  </g>

  <g class="breathe">
    <!-- 枝叶冠 -->
    <g class="leaf">
      <path d="M178 166 C164 122 150 92 134 62 C154 82 170 108 184 140 Z" fill="url(#branch)"/>
      <path d="M134 62 C124 70 114 82 108 96 C120 90 132 82 140 72 Z" fill="url(#branch)"/>
      <path d="M184 140 C196 120 208 108 222 100 C214 116 202 128 192 142 Z" fill="url(#branch)"/>
      <path d="M222 174 C238 132 254 104 272 78 C260 104 250 132 240 162 Z" fill="url(#branch)"/>
