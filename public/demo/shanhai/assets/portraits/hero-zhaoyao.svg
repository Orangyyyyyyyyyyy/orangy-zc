<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520">
  <defs>
    <radialGradient id="halo" cx=".5" cy=".44" r=".58">
      <stop offset="0" stop-color="#b9d6a8" stop-opacity=".24"/>
      <stop offset=".46" stop-color="#5f7a52" stop-opacity=".13"/>
      <stop offset="1" stop-color="#34452e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d8e8b8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d8e8b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c6344"/>
      <stop offset=".55" stop-color="#33472e"/>
      <stop offset="1" stop-color="#182416"/>
    </linearGradient>
    <linearGradient id="moss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fae76"/>
      <stop offset="1" stop-color="#4c6440"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8a894"/>
      <stop offset="1" stop-color="#5d6356"/>
    </linearGradient>
    <linearGradient id="stoneFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2c1aa"/>
      <stop offset=".65" stop-color="#9a9c86"/>
      <stop offset="1" stop-color="#6d7362"/>
    </linearGradient>
    <linearGradient id="branch" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5a4a2e"/>
      <stop offset="1" stop-color="#a98d54"/>
    </linearGradient>
    <linearGradient id="sash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a4a2e"/>
      <stop offset=".5" stop-color="#c9a961"/>
      <stop offset="1" stop-color="#5a4a2e"/>
    </linearGradient>
    <radialGradient id="vig" cx=".5" cy=".45" r=".72">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".52"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <style>
    .breathe { animation: breathe 8.6s ease-in-out infinite; transform-origin: 200px 500px; }
    .rockA { animation: rockA 9s ease-in-out infinite; transform-origin: 90px 260px; }
    .rockB { animation: rockB 11s ease-in-out infinite; transform-origin: 310px 300px; }
    .rockC { animation: rockC 13s ease-in-out infinite; transform-origin: 76px 360px; }
    .leaf { animation: leaf 8s ease-in-out infinite; transform-origin: 200px 140px; }
    .flower { animation: flower 6.4s ease-in-out infinite; transform-origin: 292px 250px; }
    .ground { animation: ground 7.4s ease-in-out infinite; transform-origin: 200px 470px; }
    .grass { animation: grass 6.8s ease-in-out infinite; transform-origin: 200px 500px; }
    .ring { animation: spin 100s linear infinite; transform-origin: 200px 230px; }
    .mossGlow { animation: mossGlow 7s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes rockA { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-12px) rotate(3deg); } }
    @keyframes rockB { 0%,100% { transform: translateY(0) rotate(2deg); } 50% { transform: translateY(-9px) rotate(-3deg); } }
    @keyframes rockC { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes leaf { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(1.4deg); } }
    @keyframes flower { 0%,100% { opacity: .72; filter: none; } 50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(216,232,184,.8)); } }
    @keyframes ground { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: .6; transform: scale(1.03); } }
    @keyframes grass { 0%,100% { transform: skewX(0deg); } 50% { transform: skewX(1.2deg); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes mossGlow { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <circle cx="200" cy="228" r="182" fill="url(#halo)"/>
  <circle cx="200" cy="228" r="178" fill="none" stroke="#c9a961" stroke-opacity=".18"/>
  <g class="ring" fill="none" stroke="#9fc7ab" stroke-opacity=".18">
    <circle cx="200" cy="228" r="160" stroke-dasharray="1 10"/>
    <circle cx="200" cy="228" r="144" stroke-dasharray="20 26"/>
    <path d="M200 56 l11 18 l-11 18 l-11 -18 Z"/>
    <path d="M200 368 l11 18 l-11 18 l-11 -18 Z"/>
  </g>
  <circle cx="200" cy="228" r="124" fill="url(#core)"/>

