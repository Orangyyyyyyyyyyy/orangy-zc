      <path d="M166 224 Q178 212 190 224 Q178 236 166 224 Z" fill="#162018"/>
      <circle cx="178" cy="224" r="5.4" fill="#9fc7ab" filter="url(#glow)"/>
      <circle cx="178" cy="224" r="1.8" fill="#eaffea"/>
      <path d="M234 224 Q222 212 210 224 Q222 236 234 224 Z" fill="#162018"/>
      <circle cx="222" cy="224" r="5.4" fill="#9fc7ab" filter="url(#glow)"/>
