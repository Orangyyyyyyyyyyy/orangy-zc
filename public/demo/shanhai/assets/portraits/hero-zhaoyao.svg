      <path d="M122 344 L88 318 L110 306 L80 282 L120 292 L116 262 L146 288 L156 318 L140 348 Z" fill="url(#stone)" stroke="#c9a961" stroke-opacity=".22"/>
      <path d="M278 344 L312 318 L290 306 L320 282 L280 292 L284 262 L254 288 L244 318 L260 348 Z" fill="url(#stone)" stroke="#c9a961" stroke-opacity=".22"/>
