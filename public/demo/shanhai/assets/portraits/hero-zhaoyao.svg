          <path d="M24 -96 Q10 -90 2 -96 Q10 -102 24 -96 Z"/>
          <path d="M-12 -96 Q2 -90 10 -96 Q2 -102 -12 -96 Z"/>
          <path d="M6 -78 Q12 -92 6 -100 Q0 -92 6 -78 Z"/>
        </g>
        <circle cx="6" cy="-96" r="3.4" fill="#c9a961" filter="url(#glow)"/>
      </g>
      <g fill="#6f8a5e">
        <path d="M-26 -100 Q-38 -108 -44 -120 Q-30 -118 -20 -106 Z"/>
        <path d="M28 -110 Q40 -116 50 -128 Q44 -112 32 -102 Z"/>
      </g>
    </g>
