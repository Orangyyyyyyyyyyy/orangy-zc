  <!-- 浮石 -->
  <g class="rockA">
    <path d="M66 246 L92 232 L114 250 L108 274 L78 278 L58 262 Z" fill="#5d6356" stroke="#c9a961" stroke-opacity=".25"/>
    <path d="M74 252 L90 244 L102 252" fill="none" stroke="#c9a961" stroke-opacity=".35"/>
    <path d="M78 268 L96 262" stroke="#8fae76" stroke-width="3" opacity=".7"/>
  </g>
  <g class="rockB">
    <path d="M302 282 L326 270 L348 288 L340 310 L314 312 L298 296 Z" fill="#5d6356" stroke="#c9a961" stroke-opacity=".25"/>
    <path d="M314 288 L330 282 L338 292" fill="none" stroke="#c9a961" stroke-opacity=".35"/>
  </g>
  <g class="rockC">
    <path d="M54 356 L74 346 L90 360 L84 378 L62 380 L48 368 Z" fill="#4a5145" stroke="#c9a961" stroke-opacity=".2"/>
  </g>

