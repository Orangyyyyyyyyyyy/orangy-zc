    <path d="M242 210 L208 220 L210 226 L242 216 Z" fill="#5d6356"/>
    <path d="M168 286 Q200 300 232 286 Q214 306 200 306 Q186 306 168 286 Z" fill="#6f8a5e" opacity=".55"/>
