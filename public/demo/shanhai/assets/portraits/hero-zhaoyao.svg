    <path d="M112 474 Q100 490 108 506 L146 500 Q136 484 142 468 Z" fill="#5d6356"/>
    <g class="ground" fill="none" stroke="#c9a961" stroke-width="1.4">
      <ellipse cx="112" cy="492" rx="42" ry="10"/>
      <ellipse cx="112" cy="492" rx="26" ry="6"/>
    </g>
