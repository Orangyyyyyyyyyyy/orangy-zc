    <path class="cloudA" d="M66 420 C84 404 110 404 124 418 C136 430 132 444 118 448 C107 450 101 442 106 435"/>
    <path class="cloudB" d="M334 432 C316 416 290 416 276 430 C264 442 268 456 282 460 C293 462 299 454 294 447"/>
  </g>

