    <path class="glyph g2" d="M336 276 l5 5 l-5 5 l-5 -5 Z"/>
    <circle class="glyph g3" cx="326" cy="426" r="3"/>
    <path class="glyph g4" d="M276 404 h10 M281 399 v10"/>
  </g>

  <!-- 白泽图 · 悬浮符简 -->
