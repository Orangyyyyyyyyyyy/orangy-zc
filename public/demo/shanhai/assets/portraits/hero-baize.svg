<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520">
  <defs>
    <radialGradient id="halo" cx=".5" cy=".42" r=".56">
      <stop offset="0" stop-color="#f0e6cf" stop-opacity=".30"/>
      <stop offset=".46" stop-color="#b9c9b2" stop-opacity=".12"/>
      <stop offset="1" stop-color="#8ca38c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff7e4" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff7e4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4edde"/>
      <stop offset=".45" stop-color="#ded4bf"/>
      <stop offset="1" stop-color="#9b9282"/>
    </linearGradient>
    <linearGradient id="robeShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f8778" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8f8778" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf5e8"/>
      <stop offset=".6" stop-color="#ddd2bb"/>
      <stop offset="1" stop-color="#a99e88"/>
    </linearGradient>
    <linearGradient id="antler" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#cbbfa4"/>
      <stop offset="1" stop-color="#f6efdd"/>
    </linearGradient>
    <linearGradient id="sash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d693c"/>
      <stop offset=".5" stop-color="#e0c98f"/>
      <stop offset="1" stop-color="#7d693c"/>
    </linearGradient>
    <radialGradient id="vig" cx=".5" cy=".45" r=".72">
      <stop offset=".52" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".52"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <style>
    .breathe { animation: breathe 7.4s ease-in-out infinite; transform-origin: 200px 470px; }
    .hair { animation: hairSway 9s ease-in-out infinite; transform-origin: 200px 170px; }
    .scrollG { animation: scrollBob 6.2s ease-in-out infinite; transform-origin: 288px 262px; }
    .scrollPaper { animation: unfurl 9.5s ease-in-out infinite; transform-origin: 288px 232px; }
    .cloudA { animation: cloudA 11s ease-in-out infinite; }
    .cloudB { animation: cloudB 13s ease-in-out infinite; }
    .mote { animation: mote 8s ease-in-out infinite; }
    .ring { animation: spin 70s linear infinite; transform-origin: 200px 225px; }
    .eyeSig { animation: eyeSig 5.2s ease-in-out infinite; transform-origin: 200px 225px; }
    .eyeSig.e2 { animation-delay: 1.2s; }
    .eyeSig.e3 { animation-delay: 2.4s; }
    .eyeSig.e4 { animation-delay: 3.4s; }
    .thirdEye { animation: thirdEye 6.6s ease-in-out infinite; transform-origin: 200px 182px; }
    .companion { animation: companion 6.8s ease-in-out infinite; transform-origin: 105px 500px; }
    .tailC { animation: tailC 7.2s ease-in-out infinite; transform-origin: 122px 420px; }
    .glyph { animation: glyph 6s ease-in-out infinite; }
    .glyph.g2 { animation-delay: 1s; }
    .glyph.g3 { animation-delay: 2s; }
    .glyph.g4 { animation-delay: 3s; }
    .glint { animation: glint 7s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes hairSway { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(.9deg); } }
    @keyframes scrollBob { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-7px) rotate(-4deg); } }
    @keyframes unfurl { 0%,70%,100% { transform: scaleY(1); } 82% { transform: scaleY(.72); } }
    @keyframes cloudA { 0%,100% { transform: translateX(0); opacity:.55; } 50% { transform: translateX(8px); opacity:.8; } }
    @keyframes cloudB { 0%,100% { transform: translateX(0); opacity:.45; } 50% { transform: translateX(-9px); opacity:.7; } }
    @keyframes mote { 0%,100% { transform: translateY(0); opacity:.15; } 45% { opacity:.85; } 100% { transform: translateY(-26px); opacity:0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes eyeSig { 0%,88%,100% { opacity:.28; } 92%,96% { opacity:.9; } }
    @keyframes thirdEye { 0%,86%,100% { transform: scaleY(1); opacity:1; } 90% { transform: scaleY(.12); opacity:.5; } 94% { transform: scaleY(1); opacity:1; } }
    @keyframes companion { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes tailC { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(4deg); } }
    @keyframes glyph { 0%,100% { opacity:.25; transform: translateY(0); } 40% { opacity:.9; } 100% { transform: translateY(-14px); opacity:0; } }
    @keyframes glint { 0%,100% { opacity:.2; } 50% { opacity:.9; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <circle cx="200" cy="225" r="178" fill="url(#halo)"/>
  <circle cx="200" cy="225" r="176" fill="none" stroke="#c9a961" stroke-opacity=".22"/>
  <g class="ring" fill="none" stroke="#c9a961" stroke-opacity=".18">
