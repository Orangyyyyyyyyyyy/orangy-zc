    <circle cx="200" cy="225" r="143" stroke-dasharray="16 26"/>
    <path d="M200 62 L210 78 L200 94 L190 78 Z"/>
    <path d="M200 356 L210 372 L200 388 L190 372 Z"/>
    <path d="M42 225 L58 215 L74 225 L58 235 Z"/>
    <path d="M326 225 L342 215 L358 225 L342 235 Z"/>
  </g>
  <circle cx="200" cy="225" r="120" fill="url(#core)"/>

  <!-- 白泽所知 · 环生诸目 -->
  <g class="eyeSig" fill="none" stroke="#e8d3a0" stroke-width="1.2">
    <path d="M156 96 Q166 88 176 96 Q166 104 156 96 Z"/><circle cx="166" cy="96" r="1.8" fill="#e8d3a0" stroke="none"/>
    <path d="M244 96 Q254 88 264 96 Q254 104 244 96 Z"/><circle cx="254" cy="96" r="1.8" fill="#e8d3a0" stroke="none"/>
