    <circle cx="3" cy="112" r="3" fill="#c9a961" opacity=".8"/>
    <circle cx="39" cy="112" r="3" fill="#c9a961" opacity=".8"/>
    <path d="M40 6 Q50 60 40 106" fill="none" stroke="#b3453c" stroke-opacity=".5" stroke-width="1.4"/>
  </g></g>
  <g fill="none" stroke="#e8d3a0" stroke-width="1.2" opacity=".7">
