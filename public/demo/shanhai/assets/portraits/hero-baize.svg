    <rect x="2" y="-7" width="38" height="13" rx="5" fill="#5b4327" stroke="#c9a961" stroke-opacity=".55"/>
    <circle cx="3" cy="-1" r="3" fill="#c9a961" opacity=".8"/>
    <circle cx="39" cy="-1" r="3" fill="#c9a961" opacity=".8"/>
    <g class="scrollPaper">
      <rect x="6" y="4" width="30" height="104" rx="2" fill="#f4ecd8" opacity=".97"/>
      <rect x="6" y="4" width="30" height="104" rx="2" fill="none" stroke="#a98d54" stroke-opacity=".75"/>
      <rect x="6" y="10" width="30" height="5" fill="#8f3428" opacity=".6"/>
      <path d="M12 22 H30 M12 32 H30 M12 42 H26 M12 52 H30 M12 62 H24 M12 72 H28 M12 82 H26"
