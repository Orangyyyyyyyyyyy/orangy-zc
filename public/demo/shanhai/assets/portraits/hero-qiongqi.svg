<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520">
  <defs>
    <radialGradient id="halo" cx=".5" cy=".44" r=".58">
      <stop offset="0" stop-color="#e08a62" stop-opacity=".28"/>
      <stop offset=".46" stop-color="#8a3527" stop-opacity=".14"/>
      <stop offset="1" stop-color="#5a1c14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb07a" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffb07a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8804f"/>
      <stop offset=".6" stop-color="#a24a30"/>
      <stop offset="1" stop-color="#6d2a1d"/>
    </linearGradient>
    <linearGradient id="furLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8a06a"/>
      <stop offset="1" stop-color="#b45d3b"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a241d"/>
      <stop offset=".55" stop-color="#241411"/>
      <stop offset="1" stop-color="#100908"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a2a20"/>
      <stop offset=".55" stop-color="#2a1511"/>
      <stop offset="1" stop-color="#120907"/>
    </linearGradient>
    <linearGradient id="sash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f1c13"/>
      <stop offset=".5" stop-color="#c0503c"/>
      <stop offset="1" stop-color="#5f1c13"/>
    </linearGradient>
    <radialGradient id="vig" cx=".5" cy=".45" r=".72">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <style>
    .breathe { animation: breathe 6.4s ease-in-out infinite; transform-origin: 200px 480px; }
    .wingL { animation: wingL 8.2s ease-in-out infinite; transform-origin: 196px 334px; }
    .wingR { animation: wingR 8.2s ease-in-out infinite; transform-origin: 204px 334px; }
    .ember { animation: ember 6s ease-in-out infinite; }
    .ember.e2 { animation-delay: 1.1s; }
    .ember.e3 { animation-delay: 2.3s; }
    .ember.e4 { animation-delay: 3.4s; }
    .ember.e5 { animation-delay: 4.2s; }
    .jaw { animation: jaw 7.6s ease-in-out infinite; transform-origin: 200px 268px; }
    .chain { animation: chain 7s ease-in-out infinite; transform-origin: 278px 424px; }
    .mane { animation: mane 5.8s ease-in-out infinite; transform-origin: 200px 300px; }
    .eyes { animation: eyes 5.6s ease-in-out infinite; }
    .ring { animation: spin 90s linear infinite; transform-origin: 200px 230px; }
    .sigil { animation: sigil 4.8s ease-in-out infinite; }
    .claw { animation: claw 7.2s ease-in-out infinite; transform-origin: 84px 430px; }
    @keyframes breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes wingL { 0%,100% { transform: rotate(0deg); } 46% { transform: rotate(2.6deg); } 56% { transform: rotate(-1.2deg); } }
    @keyframes wingR { 0%,100% { transform: rotate(0deg); } 46% { transform: rotate(-2.6deg); } 56% { transform: rotate(1.2deg); } }
    @keyframes ember { 0% { transform: translateY(0) scale(1); opacity: 0; } 18% { opacity: .9; } 100% { transform: translateY(-90px) scale(.4); opacity: 0; } }
    @keyframes jaw { 0%,82%,100% { transform: rotate(0); } 88% { transform: rotate(4deg); } 93% { transform: rotate(0); } }
    @keyframes chain { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(2.2deg); } }
    @keyframes mane { 0%,100% { transform: scale(1); } 50% { transform: scale(1.012); } }
    @keyframes eyes { 0%,88%,100% { opacity: 1; } 92% { opacity: .35; } 95% { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes sigil { 0%,100% { opacity: .22; } 50% { opacity: .65; } }
    @keyframes claw { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-2deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <circle cx="200" cy="230" r="182" fill="url(#halo)"/>
  <circle cx="200" cy="230" r="178" fill="none" stroke="#c9a961" stroke-opacity=".2"/>
