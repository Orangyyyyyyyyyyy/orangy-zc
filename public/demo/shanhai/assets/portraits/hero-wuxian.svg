<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520">
  <defs>
    <radialGradient id="halo" cx=".5" cy=".44" r=".58">
      <stop offset="0" stop-color="#9fb4e8" stop-opacity=".24"/>
      <stop offset=".46" stop-color="#4d5f8c" stop-opacity=".14"/>
      <stop offset="1" stop-color="#1d2742" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a9c6ff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#a9c6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3550"/>
      <stop offset=".55" stop-color="#1b2233"/>
      <stop offset="1" stop-color="#0a0e18"/>
    </linearGradient>
    <linearGradient id="trim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d4c72"/>
      <stop offset=".5" stop-color="#b8c6e8"/>
      <stop offset="1" stop-color="#3d4c72"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4dcef"/>
      <stop offset=".45" stop-color="#8593b8"/>
      <stop offset="1" stop-color="#3c496b"/>
    </linearGradient>
    <linearGradient id="featherDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39466a"/>
      <stop offset="1" stop-color="#141b2c"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0ead8"/>
      <stop offset="1" stop-color="#b9b29c"/>
    </linearGradient>
    <linearGradient id="staff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a5a3c"/>
      <stop offset="1" stop-color="#231c12"/>
    </linearGradient>
    <radialGradient id="flame" cx=".5" cy=".62" r=".55">
      <stop offset="0" stop-color="#e6f6ff" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#7fb6dc" stop-opacity=".7"/>
      <stop offset="1" stop-color="#3d7f9e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".45" r=".72">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <style>
    .breathe { animation: breathe 7.8s ease-in-out infinite; transform-origin: 200px 500px; }
    .plume { animation: plume 9s ease-in-out infinite; transform-origin: 200px 170px; }
    .plume.p2 { animation-delay: .7s; }
    .plume.p3 { animation-delay: 1.3s; }
    .mantle { animation: mantle 7s ease-in-out infinite; transform-origin: 200px 330px; }
    .flame { animation: flame 3.4s ease-in-out infinite; transform-origin: 290px 262px; }
    .flame2 { animation: flame2 2.8s ease-in-out infinite; transform-origin: 290px 262px; }
    .snake { animation: snake 8s ease-in-out infinite; transform-origin: 300px 460px; }
    .snakeHead { animation: snakeHead 6s ease-in-out infinite; transform-origin: 300px 300px; }
    .slip { animation: slip 9s ease-in-out infinite; transform-origin: 200px 240px; }
    .slip.s2 { animation-delay: 1.2s; }
    .slip.s3 { animation-delay: 2.4s; }
    .slip.s4 { animation-delay: 3.4s; }
    .ring { animation: spin 120s linear infinite; transform-origin: 200px 230px; }
    .star { animation: star 5.6s ease-in-out infinite; }
    .star.s2 { animation-delay: 1.1s; } .star.s3 { animation-delay: 2.2s; } .star.s4 { animation-delay: 3.3s; }
    .eye { animation: eye 6.8s ease-in-out infinite; }
    .mote { animation: mote 7s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes plume { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(1.6deg); } }
    @keyframes mantle { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.006); } }
    @keyframes flame { 0%,100% { transform: scaleY(1) skewX(0); opacity:.9; } 40% { transform: scaleY(1.12) skewX(3deg); opacity:1; } 70% { transform: scaleY(.94) skewX(-2deg); opacity:.85; } }
    @keyframes flame2 { 0%,100% { transform: scale(1) translateY(0); opacity:.55; } 50% { transform: scale(1.18) translateY(-4px); opacity:.85; } }
    @keyframes snake { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(1.4deg); } }
    @keyframes snakeHead { 0%,100% { transform: translateX(0) rotate(0deg); } 50% { transform: translateX(4px) rotate(4deg); } }
    @keyframes slip { 0%,100% { transform: translateY(0) rotate(-1deg); opacity:.7; } 50% { transform: translateY(-9px) rotate(2deg); opacity:1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes star { 0%,100% { opacity:.2; } 50% { opacity:1; } }
    @keyframes eye { 0%,88%,100% { opacity:1; } 92% { opacity:.4; } 95% { opacity:1; } }
    @keyframes mote { 0% { transform: translateY(0); opacity:0; } 20% { opacity:.8; } 100% { transform: translateY(-70px); opacity:0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

