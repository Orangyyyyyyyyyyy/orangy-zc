<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="sun" cx=".5" cy=".46" r=".55">
      <stop offset="0" stop-color="#e8c78a" stop-opacity=".30"/>
      <stop offset=".52" stop-color="#c9a961" stop-opacity=".10"/>
      <stop offset="1" stop-color="#c9a961" stop-opacity="0"/>
